    <style>
        /* 背景图 - 全屏显示必应美图 */
        #bg {
            position: fixed;
            inset: 0;
            background: center/cover no-repeat;
        }
        
        /* 玻璃卡片效果 - 毛玻璃透明效果 */
        .glass-effect {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.2), 0 8px 32px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        
        /* 卡片1居中 - 水平垂直居中（上移25px） */
        #glass {
            position: fixed;
            top: calc(50% - 125px);
            left: 50%;
            transform: translate(-50%, -50%);
            width: 660px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px 30px 30px 30px;
        }
        
        /* 卡片2居中 - 放在glass下面 */
        #glass2 {
            position: fixed;
            top: calc(50% + 80px);
            left: 50%;
            transform: translate(-50%, -50%);
            width: 660px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px 30px 30px 30px;
        }
        
        /* 搜索区域布局 - 搜索框和清除按钮在同一行居中 */
        .search-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        
        /* 搜索框样式 */
        #searchInput {
            flex: 1;
            max-width: 400px;
            padding: 10px 16px;
            font-size: 18px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            color: #fff;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        
        /* 搜索框提示文字 - "搜索..."灰蒙蒙的效果 */
        #searchInput::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* 搜索框被选中时 - 背景变浅+周围白光圈 */
        #searchInput:focus {
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
        }

        /* 公共按钮样式 - 鼠标放上去会变亮和微微变大 */
        .btn-base {
            margin: 4px 3px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: 0.15s;
            vertical-align: middle;
            color: #fff;
        }
        .btn-base:hover {
            background: rgba(255, 255, 255, 0.4);  /* 背景变亮 */
            transform: scale(1.05);  /* 微微变大 */
        }

        /* 图标按钮尺寸 - 只放图标，窄一点 */
        .icon-btn {
            padding: 6px 8px;
            font-size: 20px;
            line-height: 1;
        }
        .icon-btn img {
            display: block;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: contain;
        }

        /* 清除按钮尺寸 - 要写"清除"两个字，所以宽一点 */
        .clear-btn {
            padding: 6px 14px;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.4;
            flex-shrink: 0;
        }

        /* 按钮容器 - 让按钮能换行且居中 */
        .btn-wrap {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 2px;
            margin-top: 6px;
        }
    </style>
</head>
